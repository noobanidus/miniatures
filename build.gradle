plugins {
    id "maven-publish"
    id "me.modmuss50.mod-publish-plugin" version "2.1.1" apply false
    id "net.neoforged.moddev" version "2.0.134" apply false
    id "net.fabricmc.fabric-loom" version "1.15-SNAPSHOT" apply false
    id("org.jetbrains.gradle.plugin.idea-ext") version "1.3"
}

def javaVersion = 25
def ENV = System.getenv()

allprojects {
    version = "${rootProject.minecraft_version}-${rootProject.mod_version}"
    group = rootProject.maven_group

    repositories {
        mavenLocal()
        exclusiveContent {
            forRepository {
                maven {
                    url = "https://www.cursemaven.com"
                }
            }
            filter {
                includeGroupAndSubgroups("curse.maven")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    url = "https://api.modrinth.com/maven/"
                }
            }
            filter {
                includeGroupAndSubgroups("maven.modrinth")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    url = "https://nexus.resourcefulbees.com/repository/maven-public/"
                }
            }
            filter {
                includeGroupAndSubgroups("com.telepathicgrunt")
                includeGroupAndSubgroups("earth.terrarium.athena")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    url = "https://maven.blamejared.com"
                }
            }
            filter {
                includeGroupAndSubgroups("mezz.jei")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "TerraformersMC"
                    url = "https://maven.terraformersmc.com/"
                }
            }
            filter {
                includeGroupByRegex("dev\\.emi.*")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    url = "https://maven.shedaniel.me"
                }
            }
            filter {
                includeGroupAndSubgroups("me.shedaniel.cloth")
                includeGroupAndSubgroups("me.shedaniel")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Fuzs Mod Resources"
                    url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
                }
            }
            filter {
                includeGroupAndSubgroups("fuzs")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    // Location of the maven that hosts Team Resourceful's jars.
                    name = "Team Resourceful Maven"
                    url = "https://maven.teamresourceful.com/repository/maven-public/"
                }
            }
            filter {
                includeGroupAndSubgroups("com.teamresourceful")
            }
        }
    }

    tasks.register('buildAndRelease') {
        dependsOn(tasks.build, tasks.publish)
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'me.modmuss50.mod-publish-plugin'
    project.group = rootProject.group
    project.version = rootProject.version

    base {
        archivesName.set("${rootProject.mod_id}-${name}")
    }

    repositories {}

    dependencies {
        compileOnly "org.jetbrains:annotations:${jetbrains_annotations_version}"
        compileOnly("com.google.auto.service:auto-service-annotations:${rootProject.auto_service_version}")
        annotationProcessor("com.google.auto.service:auto-service:${rootProject.auto_service_version}")
        implementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-common-26.1:${rootProject.resourceful_config_version}"
    }

    processResources {
        filteringCharset "UTF-8"

        def expandProps = [
                "version"              : project.version,
                "mod_version"          : project.mod_version,
                "maven_group_id"       : project.mod_group_id,
                "mod_id"               : project.mod_id,
                "mod_display_name"     : project.mod_name,
                "mod_description"      : project.mod_description,
                "sources_url"          : project.sources_url,
                "issues_url"           : project.issues_url,
                "license_url"          : project.license_url,
                "homepage_url"         : project.homepage_url,

                "minecraft_version"    : project.minecraft_version,
                "neoforge_version"     : project.neoforge_version,
                "fabric_loader_version": project.fabric_loader_version,
                "java_version"         : "25",
        ]

        filesMatching(['pack.mcmeta', '*.mod.json', 'META-INF/neoforge.mods.toml']) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }

    java {
        if (JavaVersion.current() < JavaVersion.toVersion(javaVersion)) {
            toolchain {
                languageVersion = JavaLanguageVersion.of(javaVersion)
            }
        } else {
            sourceCompatibility = JavaVersion.toVersion(javaVersion)
            targetCompatibility = JavaVersion.toVersion(javaVersion)
        }

        withSourcesJar()
    }

    javadoc {
        options.tags = ["reason"]
    }

    tasks.withType(JavaCompile).configureEach {
        options.release.set(javaVersion)
    }

    tasks.publishMods.mustRunAfter tasks.publish
    tasks.buildAndRelease.dependsOn(tasks.publish).dependsOn(tasks.publishMods)
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
