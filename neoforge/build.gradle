plugins {
    id 'net.neoforged.moddev'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
}

dependencies {
    compileOnly(project(':common')) {
        transitive = false
    }
}
publishMods {
    file = tasks.jar.archiveFile
    modLoaders.add("neoforge")

    var env = System.getenv()

    def gitRepo = getExecOutput(['git', 'remote', 'get-url', 'origin'])
    def gitCommit = getExecOutput(['git', 'log', '-n', '1', '--pretty=tformat:%h'])
    def gitPrevCommit = project.findProperty("git_previous_commit") ?: env["GIT_PREVIOUS_COMMIT"]

    var changelogText = ""

    if (gitCommit && gitPrevCommit) {
        changelogText += getExecOutput(['git', 'log', "--pretty=tformat:- %s [(%h)](${gitRepo}/commit/%h)", '' + gitPrevCommit + '..' + gitCommit])
    }

    if (project.hasProperty('curseforge_id')) {
        curseforge('curseforgeNeoForge') {
            type = ALPHA

            projectSlug = "miniatures"
            displayName = "miniatures-neoforge-${rootProject.minecraft_version}-${rootProject.mod_version}"
            accessToken = project.findProperty("curse_auth")
            projectId = project.findProperty('curseforge_id')
            announcementTitle = "Miniatures ${rootProject.minecraft_version}-${rootProject.mod_version} for NeoForge on CurseForge"
            minecraftVersions.add(project.minecraft_version)
            changelog = changelogText
        }
    }

    if (project.hasProperty("curse_discord_webhook")) {
        discord {
            webhookUrl = project.findProperty("curse_discord_webhook")
            username = "Miniatures Update"
            content = "A new version of Miniatures has been released!\n\n${changelogText.take(500)}"
        }
    }
}

neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    def atFile = project.file("../common/src/main/resources/META-INF/accesstransformer.cfg")
    if (atFile.exists()) {
        accessTransformers {
            from atFile
            publish atFile
        }
    }

    validateAccessTransformers.set(true)

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project.project(":common").sourceSets.main)
        }
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG

            gameDirectory = project.file('run')

            sourceSet = sourceSets.main
            loadedMods.set([mods."${mod_id}"])
        }

        client {
            client()
            //systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            if (project.hasProperty('mc_uuid')) {
                programArguments.add("--uuid=${project.findProperty('mc_uuid')}")
            }

            if (project.hasProperty('mc_username')) {
                programArguments.add("--username=${project.findProperty('mc_username')}")
            }

            if (project.hasProperty('mc_java_agent_path')) {
                jvmArgument("-javaagent:${project.findProperty('mc_java_agent_path')}")
            }
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments.add('--nogui')
        }

        clientData {
            clientData()
            programArguments.addAll '--all', '--mod', 'miniatures', '--existing', project.project(":common").file("src/main/resources").absolutePath, '--output', project.project(":common").file("src/generated/resources").absolutePath
        }
    }
}

tasks.named("compileJava", JavaCompile) {
    source(project.project(":common").sourceSets.main.allJava)
}

tasks.named("javadoc", Javadoc) {
    source(project.project(":common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
    from(project.project(":common").sourceSets.main.allSource)
}

processResources {
    from project.project(":common").sourceSets.main.resources
}

publishing {
    tasks.publish.dependsOn build

    publications {
        mavenJava(MavenPublication) {

            artifactId project.archivesBaseName
            artifact jar
            artifact project.sourcesJar {
                archiveClassifier.set('sources')
            }

            pom {
                name = 'Miniatures'
                description = 'Friendly loot for everyone.'
                url = 'https://github.com/Noobanidus/Miniatures'

                scm {
                    connection = 'git:https://github.com/Noobanidus/Miniatures.git'
                    developerConnection = 'git:https://github.com/Noobanidus/Miniatures.git'
                    url = 'https://github.com/Noobanidus/Miniatures'
                }

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'noobanidus'
                        name = 'Noobanidus'
                        email = 'noobanidus+spam@gmail.com'
                    }
                }
            }
        }
    }

    repositories {
        maven {
            url "file:///" + System.getenv("local_maven")
        }
    }
}

tasks.build.mustRunAfter tasks.clean
tasks.publish.mustRunAfter tasks.build
tasks.publishMods.mustRunAfter tasks.publish
tasks.buildAndRelease.dependsOn(tasks.clean, tasks.build, tasks.publish, tasks.publishMods)
